<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Report Vault - Swasthya Sakhi</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .report-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .report-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--emerald), var(--teal));
        }

        .report-card:hover {
            transform: translateY(-4px);
            border-color: var(--emerald);
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 6rem; padding-bottom: 4rem;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="margin-bottom: 1rem;">
                <i class="fas fa-shield-alt"></i>
                Your <span class="gradient-text">Secure Medical Vault</span>
            </h1>
            <p style="font-size: 1.125rem; color: var(--gray-300); margin-bottom: 2rem;">
                End-to-end encrypted. Always free.
            </p>
            <a href="/report-analysis/" class="btn btn-glow" style="padding: 1rem 2rem;">
                <i class="fas fa-brain"></i> AI Report Analysis
            </a>
        </div>

        <!-- Reports Section -->
        <div id="reportsSection">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3><i class="fas fa-folder-open"></i> Your Reports (<span id="reportCount">0</span>)</h3>
            </div>

            <div class="features-grid" id="reportsGrid">
                <!-- Reports loaded here -->
            </div>

            <div id="emptyState" style="display: none; text-align: center; padding: 4rem;">
                <i class="fas fa-inbox" style="font-size: 4rem; color: rgba(255,255,255,0.3); margin-bottom: 1rem;"></i>
                <h3>No Reports Yet</h3>
                <p style="color: rgba(255,255,255,0.6);">
                    Reports uploaded by authorized hospital staff will appear here
                </p>
            </div>
        </div>
    </div>

    <script>
        let reports = [];

        // Check authentication
        const userRole = localStorage.getItem('userRole');
        if (!userRole || userRole !== 'PATIENT') {
            window.location.href = '/login/';
        }

        // Load reports directly
        async function loadReports() {
            try {
                const authToken = localStorage.getItem('authToken');
                const headers = { 'Content-Type': 'application/json' };
                if (authToken) headers['Authorization'] = 'Bearer ' + authToken;

                const response = await fetch('/api/patient/reports/', { headers });
                const data = await response.json();
                
                if (data.success) {
                    reports = data.data;
                    document.getElementById('reportCount').textContent = reports.length;
                    
                    if (reports.length === 0) {
                        document.getElementById('emptyState').style.display = 'block';
                        return;
                    }
                    
                    const grid = document.getElementById('reportsGrid');
                    grid.innerHTML = reports.map(report => `
                        <div class="report-card">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                                <div>
                                    <h4 style="margin-bottom: 0.5rem;">${report.title}</h4>
                                    <span style="padding: 0.3rem 0.8rem; background: rgba(16,185,129,0.2); color: var(--emerald); border-radius: 50px; font-size: 0.8rem;">
                                        ${report.scan_type}
                                    </span>
                                </div>
                                <i class="fas fa-file-pdf" style="font-size: 2rem; color: #ef4444;"></i>
                            </div>
                            
                            <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 1rem;">
                                <i class="fas fa-hospital"></i> ${report.hospital_name || 'Hospital'}<br>
                                <i class="fas fa-calendar"></i> ${new Date(report.uploaded_date).toLocaleDateString()}
                            </p>
                            
                            <div style="display: flex; gap: 0.5rem;">
                                <button onclick="viewReport(${report.id})" class="btn" style="flex: 1; font-size: 0.9rem;">
                                    <i class="fas fa-eye"></i> View
                                </button>
                                <button onclick="analyzeReport(${report.id})" class="btn btn-glow" style="flex: 1; font-size: 0.9rem;">
                                    <i class="fas fa-brain"></i> AI Analysis
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Failed to load reports:', error);
            }
        }

        // View report
        async function viewReport(reportId) {
            try {
                const authToken = localStorage.getItem('authToken');
                
                // Create a form to POST with token in header
                const response = await fetch('/api/patient/report/' + reportId + '/', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + authToken
                    }
                });
                
                if (response.ok) {
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        const data = await response.json();
                        alert(data.error || 'Cannot view report');
                    } else {
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.target = '_blank';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                } else {
                    const err = await response.json();
                    alert(err.error || 'Failed to view report');
                }
            } catch (error) {
                console.error('Failed to view report:', error);
                alert('Failed to view report. Please try again.');
            }
        }

        // Analyze report
        function analyzeReport(reportId) {
            window.location.href = `/report-analysis/?report_id=${reportId}`;
        }

        // Load reports on page load
        loadReports();
    </script>
</body>
</html>
